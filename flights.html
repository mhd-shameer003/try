<!DOCTYPE html>
<html>
<head>
    <title>Flights</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="flights-page">

<header>
    <h1>Flights</h1>
</header>

<nav>
    <a href="home.html">Home</a>
    <a href="hotels.html">Hotels</a>
    <a href="packages.html">Holiday Packages</a>
    <a href="booking.html">Booking</a>
    <a href="payment.html">Payment</a>
    <a href="confirmation.html">booking status</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="search-box">

<h2>Search Flights</h2>

<label>From</label>
<input type="text" id="from">

<label>To</label>
<input type="text" id="to">

<label>Departure Date</label>
<input type="date" id="depart">

<label>Passengers</label>
<input type="number" id="passengers" min="1" value="1">

<button id="searchFlight">Search Flight</button>

</div>

<section class="cards">

<div class="card">
<h3>IndiGo</h3>
<p>Chennai → Goa</p>
<p>₹4,500</p>
<button onclick="window.location.href='flightbooking.html'">Book</button>
</div>

<div class="card">
<h3>Air India</h3>
<p>Chennai → Kerala</p>
<p>₹5,200</p>
<button onclick="window.location.href='flightbooking.html'">Book</button>
</div>
<div class="card">
<h3>SpiceJet</h3>
<p>Chennai → Ooty</p>
<p>₹4,800</p>
<button onclick="window.location.href='flightbooking.html'">Book</button>
</div>

</section>

<footer>
Dream Travels
</footer>

<script>

// Minimum date = Today
const depart = document.getElementById("depart");
const today = new Date().toISOString().split("T")[0];
depart.min = today;
// Search Flight
document.getElementById("searchFlight").addEventListener("click", function(){

    let from = document.getElementById("from").value.trim().toLowerCase();
    let to = document.getElementById("to").value.trim().toLowerCase();
    let date = document.getElementById("depart").value;
    let passengers = document.getElementById("passengers").value;

    if(from=="" || to=="" || date==""){
        alert("Please fill all fields.");
        return;
    }

    if(from==to){
        alert("Departure and Destination cannot be the same.");
        return;
    }

    if(from=="chennai" && to=="goa"){
        alert("Flight Available!\n\nAirline : IndiGo\nPrice : ₹4,500");
    }

    else if(from=="chennai" && to=="kerala"){
        alert("Flight Available!\n\nAirline : Air India\nPrice : ₹5,200");
    }

    else if(from=="chennai" && to=="ooty"){
        alert("Flight Available!\n\nAirline : SpiceJet\nPrice : ₹4,800");
    }

    else{
        alert("Sorry! No flights available for this route.");
    }

});

</script>

</body>
</html>
